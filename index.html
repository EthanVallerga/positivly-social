<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Positivly — Content Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FFF5F2; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 680px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 2rem; }
  .logo img { width: 52px; height: 52px; border-radius: 14px; }
  .header h1 { font-size: 24px; font-weight: 700; color: #1a1a1a; }
  .header p { font-size: 13px; color: #aaa; margin-top: 2px; }
  .card { background: white; border-radius: 18px; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #f5e8e4; }
  .section-label { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .tab-btn { font-size: 13px; padding: 7px 16px; border-radius: 20px; border: 1.5px solid #eee; background: white; cursor: pointer; color: #888; transition: all 0.15s; }
  .tab-btn.active { background: #F4836A; color: white; border-color: #F4836A; font-weight: 600; }
  .tab-btn:hover:not(.active) { border-color: #F4836A; color: #F4836A; }
  .platform-btn { font-size: 12px; padding: 6px 14px; border-radius: 8px; border: 1.5px solid #eee; background: white; cursor: pointer; color: #888; transition: all 0.15s; }
  .platform-btn.active { background: #FFF0ED; border-color: #F4836A; color: #c05540; font-weight: 600; }
  input[type="text"] { width: 100%; padding: 11px 14px; border: 1.5px solid #eee; border-radius: 10px; font-size: 14px; margin-bottom: 1.25rem; outline: none; font-family: inherit; background: #fafafa; transition: border 0.15s; }
  input[type="text"]:focus { border-color: #F4836A; background: white; }
  .checkbox-group { display: flex; gap: 20px; margin-bottom: 1.25rem; }
  .checkbox-group label { font-size: 13px; color: #444; display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .gen-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; background: #F4836A; color: white; border: none; border-radius: 12px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.2px; }
  .gen-btn:hover { background: #e06b52; }
  .gen-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; padding: 10px 14px; background: #fdf0f0; border-radius: 8px; }
  .output { display: none; }
  .caption-block { margin-bottom: 1.25rem; }
  .caption-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .caption-label { font-size: 13px; font-weight: 600; color: #555; }
  .copy-btn { font-size: 12px; padding: 5px 12px; border-radius: 6px; border: 1.5px solid #eee; background: white; cursor: pointer; color: #888; transition: all 0.15s; }
  .copy-btn:hover { background: #FFF0ED; border-color: #F4836A; color: #F4836A; }
  .copy-btn.copied { background: #E1F5EE; border-color: #0F6E56; color: #0F6E56; }
  textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #f0f0f0; border-radius: 10px; font-size: 13px; line-height: 1.6; background: #fafafa; color: #1a1a1a; resize: none; font-family: inherit; }
  .divider { border: none; border-top: 1px solid #f5f5f5; margin: 1.25rem 0; }
  .hashtag-area { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .hashtag { background: #FFF0ED; color: #c05540; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
  .image-container { position: relative; width: 100%; border-radius: 14px; overflow: hidden; background: #f5f5f5; min-height: 200px; }
  .image-container img { width: 100%; display: block; border-radius: 14px; }
  .image-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.75)); padding: 2rem 1.5rem 1.5rem; border-radius: 0 0 14px 14px; }
  .image-overlay .overlay-logo { width: 36px; height: 36px; border-radius: 10px; margin-bottom: 8px; }
  .image-overlay .overlay-text { font-size: 22px; font-weight: 800; color: white; line-height: 1.3; margin-bottom: 4px; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .image-overlay .overlay-sub { font-size: 14px; color: rgba(255,255,255,0.85); }
  .image-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; color: #aaa; gap: 12px; }
  .image-loading .spinner { width: 36px; height: 36px; border: 3px solid #f0e8e4; border-top-color: #F4836A; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .reel-hook { background: linear-gradient(135deg, #F4836A, #f0a090); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .reel-hook .hook-label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .reel-hook .hook-text { font-size: 15px; color: white; font-weight: 500; }
  .reel-scene { border-left: 3px solid #F4836A; padding: 10px 14px; margin-bottom: 8px; background: #FFF5F2; border-radius: 0 10px 10px 0; }
  .scene-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .scene-num { font-size: 12px; font-weight: 700; color: #1a1a1a; }
  .scene-dur { font-size: 11px; color: #bbb; }
  .scene-visual { font-size: 12px; color: #999; margin-bottom: 3px; }
  .scene-overlay { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 3px; }
  .scene-vo { font-size: 12px; color: #888; font-style: italic; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .pulsing { animation: pulse 1.2s ease-in-out infinite; }
  .source-tag { font-size: 11px; color: #bbb; margin-top: 6px; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo"><img src="https://i.imgur.com/placeholder.png" id="logo-img" onerror="this.style.display='none'" alt="Positivly"></div>
    <div>
      <h1>Positivly</h1>
      <p>Social media content generator</p>
    </div>
  </div>

  <div class="card">
    <p class="section-label">Content type</p>
    <div class="btn-group">
      <button class="tab-btn active" onclick="setType('news',this)">Good news</button>
      <button class="tab-btn" onclick="setType('affirmation',this)">Affirmation</button>
      <button class="tab-btn" onclick="setType('quote',this)">Quote</button>
      <button class="tab-btn" onclick="setType('fact',this)">Positive fact</button>
    </div>

    <p class="section-label">Topic or theme (optional)</p>
    <input type="text" id="topic" placeholder="e.g. nature, science, kindness, animals..." />

    <p class="section-label">Platforms</p>
    <div class="btn-group">
      <button class="platform-btn active" onclick="togglePlatform('instagram',this)">📷 Instagram</button>
      <button class="platform-btn active" onclick="togglePlatform('twitter',this)">𝕏 Twitter</button>
      <button class="platform-btn active" onclick="togglePlatform('facebook',this)">f Facebook</button>
    </div>

    <p class="section-label">Also generate</p>
    <div class="checkbox-group">
      <label><input type="checkbox" id="gen-image" checked> AI image card</label>
      <label><input type="checkbox" id="gen-reel" checked> Reel script</label>
    </div>

    <button class="gen-btn" id="gen-btn" onclick="generate()">✨ Generate content</button>
    <p class="error" id="error-msg"></p>
  </div>

  <div class="output" id="output">

    <div class="card" id="captions-card">
      <div class="card-header">
        <p class="section-label" style="margin:0;">Captions</p>
        <span class="pill" id="type-pill" style="background:#FFF0ED;color:#c05540;">Good news</span>
      </div>
      <div id="ig-block" class="caption-block">
        <div class="caption-header">
          <span class="caption-label">📷 Instagram</span>
          <button class="copy-btn" onclick="copyField('ig-caption',this)">Copy</button>
        </div>
        <textarea id="ig-caption" rows="5" readonly></textarea>
      </div>
      <div id="tw-block" class="caption-block">
        <div class="caption-header">
          <span class="caption-label">𝕏 Twitter / X</span>
          <button class="copy-btn" onclick="copyField('tw-caption',this)">Copy</button>
        </div>
        <textarea id="tw-caption" rows="3" readonly></textarea>
      </div>
      <div id="fb-block" class="caption-block">
        <div class="caption-header">
          <span class="caption-label">f Facebook</span>
          <button class="copy-btn" onclick="copyField('fb-caption',this)">Copy</button>
        </div>
        <textarea id="fb-caption" rows="5" readonly></textarea>
      </div>
      <hr class="divider">
      <p class="section-label">Hashtags</p>
      <div class="hashtag-area" id="hashtag-display"></div>
      <textarea id="hashtag-raw" style="display:none;"></textarea>
      <button class="copy-btn" onclick="copyField('hashtag-raw',this)" style="margin-top:8px;">Copy all hashtags</button>
    </div>

    <div class="card" id="image-card">
      <div class="card-header">
        <p class="section-label" style="margin:0;">AI image card</p>
        <button class="copy-btn" id="dl-btn" onclick="downloadImage()" style="display:none;">⬇ Download</button>
      </div>
      <div class="image-container" id="image-container">
        <div class="image-loading" id="image-loading">
          <div class="spinner"></div>
          <span>Generating image...</span>
        </div>
      </div>
    </div>

    <div class="card" id="reel-card">
      <p class="section-label">Reel script & storyboard</p>
      <div id="reel-content"></div>
    </div>

  </div>
</div>

<script>
  const PROXY = 'https://positivly-proxy-production.up.railway.app';
  const LOGO_URL = 'https://EthanVallerga.github.io/positivly-social/positivly_logo.png';
  let currentType = 'news';
  let platforms = new Set(['instagram','twitter','facebook']);
  let usedTopics = [];
  let currentImageUrl = null;

  const typeLabels = { news:'Good news', affirmation:'Affirmation', quote:'Quote', fact:'Positive fact' };
  const pillColors = {
    news: {bg:'#FFF0ED',color:'#c05540'},
    affirmation: {bg:'#E1F5EE',color:'#0F6E56'},
    quote: {bg:'#EEEDFE',color:'#3C3489'},
    fact: {bg:'#FEF9C3',color:'#854F0B'}
  };

  const typeInstructions = {
    news: `a REAL, specific, recent positive news story with actual place names, organization names, and where appropriate real people's names. Examples of the kind of specificity wanted: "Researchers at Johns Hopkins University in Baltimore have developed...", "The small town of Brumby, Nebraska celebrated..." — make it feel like a real news story, not vague feel-good content. Cover science breakthroughs, community wins, environmental recovery, medical advances, animal rescues, acts of kindness at scale.`,
    affirmation: `a warm, grounded affirmation written in SECOND PERSON using "you" and "your" — NOT "I" or "my". Make it specific and real, not vague poster-speak. Bad example: "I am enough." Good example: "You've already handled harder days than this one — and you came out the other side." Avoid clichés.`,
    quote: `an inspiring quote from a real, named historical figure or well-known person. Include their full name and a brief description of who they are. Make sure the quote is genuinely attributed to them.`,
    fact: `a surprising, specific, joyful fact about the world — nature, science, animals, human history, psychology. Include real numbers, species names, place names where relevant. Make it feel like something you'd want to immediately share with a friend.`
  };

  function setType(type, btn) {
    currentType = type;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function togglePlatform(p, btn) {
    if (platforms.has(p) && platforms.size === 1) return;
    if (platforms.has(p)) { platforms.delete(p); btn.classList.remove('active'); }
    else { platforms.add(p); btn.classList.add('active'); }
  }

  function copyField(id, btn) {
    const el = document.getElementById(id);
    navigator.clipboard.writeText(el.value || el.innerText).then(() => {
      if (btn) {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
      }
    }).catch(()=>{});
  }

  function downloadImage() {
    if (!currentImageUrl) return;
    const a = document.createElement('a');
    a.href = currentImageUrl;
    a.download = 'positivly-post.jpg';
    a.target = '_blank';
    a.click();
  }

  async function generate() {
    const errEl = document.getElementById('error-msg');
    errEl.style.display = 'none';
    const btn = document.getElementById('gen-btn');
    btn.disabled = true;
    btn.textContent = 'Generating...';
    btn.classList.add('pulsing');

    const topic = document.getElementById('topic').value.trim();
    const genImage = document.getElementById('gen-image').checked;
    const genReel = document.getElementById('gen-reel').checked;

    document.getElementById('output').style.display = 'block';

    const pill = document.getElementById('type-pill');
    pill.textContent = typeLabels[currentType];
    pill.style.background = pillColors[currentType].bg;
    pill.style.color = pillColors[currentType].color;

    document.getElementById('ig-block').style.display = platforms.has('instagram') ? 'block' : 'none';
    document.getElementById('tw-block').style.display = platforms.has('twitter') ? 'block' : 'none';
    document.getElementById('fb-block').style.display = platforms.has('facebook') ? 'block' : 'none';
    document.getElementById('image-card').style.display = genImage ? 'block' : 'none';
    document.getElementById('reel-card').style.display = genReel ? 'block' : 'none';
    document.getElementById('dl-btn').style.display = 'none';

    ['ig-caption','tw-caption','fb-caption'].forEach(id => { document.getElementById(id).value = 'Writing...'; });
    document.getElementById('hashtag-display').innerHTML = '<span style="color:#ccc;font-size:13px;">Finding hashtags...</span>';

    if (genImage) {
      document.getElementById('image-container').innerHTML = `<div class="image-loading" id="image-loading"><div class="spinner"></div><span>Generating image...</span></div>`;
    }
    if (genReel) document.getElementById('reel-content').innerHTML = '<p style="color:#ccc;font-size:13px;padding:8px 0;">Building reel script...</p>';

    const avoidList = usedTopics.length > 0 ? `\n\nIMPORTANT: Do NOT repeat any of these recently used topics/subjects: ${usedTopics.slice(-8).join(', ')}. Generate something completely fresh and different.` : '';

    const prompt = `You are the content director for "Positivly" — an app for spreading real, uplifting content. Brand voice: warm, grounded, specific — NOT generic or clichéd.

Generate content for: ${typeInstructions[currentType]}${topic ? `\n\nUser-requested theme: ${topic}` : ''}${avoidList}

Return ONLY valid JSON, no markdown, no backticks, no extra text:
{
  "core_subject": "2-4 word summary of the specific topic (used to avoid repetition)",
  "instagram": "caption 150-220 chars, warm and engaging, 2-3 relevant emojis at end",
  "twitter": "post max 240 chars, punchy and shareable, 1-2 emojis max",
  "facebook": "post 180-280 chars, conversational and warm, feels like a friend sharing something",
  "hashtags": ["10to12","relevant","specific","hashtags","no","hash","symbol"],
  "image_prompt": "A vivid, photorealistic image generation prompt describing a stunning, eye-catching photograph that perfectly represents the content. Be specific about subject, lighting, mood, composition. Example: 'Stunning underwater photograph of a glowing immortal jellyfish Turritopsis dohrnii in deep blue ocean water, bioluminescent, ethereal light rays, macro photography, National Geographic style'",
  "image_text": "5-8 word punchy headline for image overlay",
  "image_subtext": "max 6 word supporting line",
  "reel_hook": "Attention-grabbing 3 second spoken hook — make it surprising or emotional",
  "reel_scenes": [
    {"scene":1,"duration":"3s","visual":"vivid description of opening visual","text_overlay":"hook text on screen","voiceover":"spoken words"},
    {"scene":2,"duration":"4s","visual":"vivid description","text_overlay":"key fact or statement","voiceover":"spoken words"},
    {"scene":3,"duration":"4s","visual":"vivid description","text_overlay":"emotional moment","voiceover":"spoken words"},
    {"scene":4,"duration":"4s","visual":"vivid description","text_overlay":"inspiring takeaway","voiceover":"spoken words"},
    {"scene":5,"duration":"5s","visual":"Positivly app branding on warm coral background","text_overlay":"Download Positivly — good vibes only","voiceover":"More moments like this, every day. Download Positivly."}
  ]
}`;

    try {
      const res = await fetch(PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          max_tokens: 1400,
          temperature: 0.9,
          messages: [
            { role: 'system', content: 'You are a creative content director. Respond with valid JSON only — no markdown, no backticks, no extra text.' },
            { role: 'user', content: prompt }
          ]
        })
      });

      if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `Error ${res.status}`); }

      const data = await res.json();
      const result = JSON.parse(data.choices[0].message.content.trim().replace(/```json|```/g,'').trim());

      if (result.core_subject) {
        usedTopics.push(result.core_subject);
        if (usedTopics.length > 20) usedTopics.shift();
      }

      document.getElementById('ig-caption').value = result.instagram || '';
      document.getElementById('tw-caption').value = result.twitter || '';
      document.getElementById('fb-caption').value = result.facebook || '';

      const tags = (result.hashtags||[]).map(h=>`#${h}`);
      document.getElementById('hashtag-display').innerHTML = tags.map(t=>`<span class="hashtag">${t}</span>`).join('');
      document.getElementById('hashtag-raw').value = tags.join(' ');

      if (genImage && result.image_prompt) {
        generateImage(result.image_prompt, result.image_text, result.image_subtext);
      }
      if (genReel) drawReel(result);

    } catch(e) {
      errEl.textContent = `Error: ${e.message}`;
      errEl.style.display = 'block';
      ['ig-caption','tw-caption','fb-caption'].forEach(id => { document.getElementById(id).value = ''; });
    }

    btn.disabled = false;
    btn.textContent = '✨ Generate content';
    btn.classList.remove('pulsing');
  }

  async function generateImage(prompt, overlayText, overlaySub) {
    const container = document.getElementById('image-container');
    const encodedPrompt = encodeURIComponent(prompt + ', high quality, vibrant, eye-catching, social media ready');
    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1080&height=1080&nologo=true&seed=${Math.floor(Math.random()*99999)}`;

    currentImageUrl = imageUrl;

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      container.innerHTML = '';
      const canvas = document.createElement('canvas');
      canvas.width = 1080;
      canvas.height = 1080;
      const ctx = canvas.getContext('2d');

      ctx.drawImage(img, 0, 0, 1080, 1080);

      const grad = ctx.createLinearGradient(0, 600, 0, 1080);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.78)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1080, 1080);

      const logoImg = new Image();
      logoImg.crossOrigin = 'anonymous';
      logoImg.onload = () => {
        const lSize = 80;
        const lX = 60;
        const lY = 1080 - 240;
        ctx.save();
        ctx.beginPath();
        roundRect(ctx, lX, lY, lSize, lSize, 20);
        ctx.clip();
        ctx.drawImage(logoImg, lX, lY, lSize, lSize);
        ctx.restore();

        drawOverlayText(ctx, overlayText, overlaySub, lY + lSize + 20);

        canvas.style.width = '100%';
        canvas.style.borderRadius = '14px';
        canvas.style.display = 'block';
        container.appendChild(canvas);
        document.getElementById('dl-btn').style.display = 'inline-block';

        canvas.onclick = () => {
          const a = document.createElement('a');
          a.download = 'positivly-post.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
        };
        canvas.style.cursor = 'pointer';
        canvas.title = 'Click to download';

        currentImageUrl = canvas.toDataURL('image/png');
      };
      logoImg.onerror = () => {
        drawOverlayText(ctx, overlayText, overlaySub, 1080 - 200);
        canvas.style.width = '100%';
        canvas.style.borderRadius = '14px';
        canvas.style.display = 'block';
        container.appendChild(canvas);
        document.getElementById('dl-btn').style.display = 'inline-block';
        currentImageUrl = canvas.toDataURL('image/png');
      };
      logoImg.src = LOGO_URL;
    };

    img.onerror = () => {
      container.innerHTML = `<div class="image-loading"><span style="color:#F4836A;">Image generation timed out — try again</span></div>`;
    };

    img.src = imageUrl;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  function drawOverlayText(ctx, text, sub, startY) {
    const words = (text||'').toUpperCase().split(' ');
    const lines = []; let line = '';
    ctx.font = 'bold 72px -apple-system,sans-serif';
    for (const w of words) {
      const t = line ? line+' '+w : w;
      if (ctx.measureText(t).width > 960) { lines.push(line); line = w; } else line = t;
    }
    if (line) lines.push(line);

    ctx.fillStyle = 'white';
    ctx.font = 'bold 72px -apple-system,sans-serif';
    let y = startY;
    for (const l of lines) { ctx.fillText(l, 60, y); y += 86; }

    if (sub) {
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = '400 36px -apple-system,sans-serif';
      ctx.fillText(sub, 60, y + 10);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '400 24px -apple-system,sans-serif';
    ctx.fillText('positivly.app', 60, 1080 - 40);
  }

  function drawReel(result) {
    const c = document.getElementById('reel-content');
    let html = `<div class="reel-hook"><p class="hook-label">Hook (0–3s)</p><p class="hook-text">"${result.reel_hook||''}"</p></div>`;
    for (const sc of result.reel_scenes||[]) {
      html += `<div class="reel-scene">
        <div class="scene-header"><span class="scene-num">Scene ${sc.scene}</span><span class="scene-dur">${sc.duration}</span></div>
        <p class="scene-visual">👁 ${sc.visual}</p>
        <p class="scene-overlay">"${sc.text_overlay}"</p>
        <p class="scene-vo">${sc.voiceover}</p>
      </div>`;
    }
    c.innerHTML = html;
  }
</script>
</body>
</html>
